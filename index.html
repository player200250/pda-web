/* ================= 事件 ================= */
function wire() {
  const v = $("#view");

  v.onclick = e => {
    const el = e.target.closest("[data-act],[data-go]");
    if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;

    switch (act) {
      case "focusQuick": { const q = $("#quickTodo"); if (q) q.focus(); break; }
      case "quickAdd": {
        const i = $("#quickTodo");
        if (i.value.trim()) { db.todos.push({ id: uid(), text: i.value.trim(), due: "", pri: 0, done: false, created: Date.now() }); save(true); state.focus = "#quickTodo"; render(); }
        break;
      }
      case "openMemo":
      case "selMemo": { const m = db.memos.find(x => x.id === id); if (m) showMemo(m); break; }
      case "newMemo": {
        const kb = (el.dataset.go || state.view) === "kb";
        const m = { id: uid(), title: "", body: "", kb, updated: Date.now() };
        db.memos.unshift(m); state.memoSel = m.id; state.memoQ = ""; state.memoPreview = false; save(true);
        state.focus = "#memoTitle"; render(); break;
      }
      case "memoTag": state.memoTag = el.dataset.tag || ""; render(); break;
      case "md": mdAction(el.dataset.k); break;
      case "memoMode": state.memoPreview = el.dataset.k === "preview"; if (!state.memoPreview) state.focus = "#memoBody"; render(); break;
      case "setMemoBig": db.settings.memoBig = !db.settings.memoBig; save(true); render(); break;
      case "setMemoBar": db.settings.memoBar = db.settings.memoBar === false; save(true); render(); break;
      case "setMemoMode": db.settings.memoMode = el.dataset.k; state.memoPreview = el.dataset.k === "preview"; save(true); render(); break;
      case "setMemoTpl": db.settings.memoTpl = $("#memoTplIn").value; save(true); render(); say("筆記範本已更新。"); break;
      case "resetMemoTpl": db.settings.memoTpl = ""; save(true); render(); break;
      case "newMemoTitled": {
        const m = { id: uid(), title: el.dataset.title, body: "", kb: state.view === "kb", updated: Date.now() };
        db.memos.unshift(m); state.memoSel = m.id; state.memoQ = ""; state.memoTag = ""; state.memoPreview = false; save(true);
        state.focus = "#memoBody"; render(); break;
      }
      case "moveMemo": {
        const m = db.memos.find(x => x.id === id);
        if (!m) break;
        m.kb = !m.kb; save(true); render(); say(`已移到${m.kb ? "知識庫" : "備忘錄"}。`);
        break;
      }
      case "delMemo":
        if (confirm("刪除這則筆記？")) {
          db.memos = db.memos.filter(m => m.id !== id);
          state.memoSel = null; save(true); render();
        }
        break;
      case "addTodo": {
        const t = $("#todoText");
        if (!t.value.trim()) { t.focus(); break; }
        db.todos.push({
          id: uid(), text: t.value.trim(), due: $("#todoDue").value,
          pri: $("#todoPri").checked ? 1 : 0, skill: $("#todoSkill")?.value || "",
          done: false, xpGiven: 0, created: Date.now()
        });
        save(true); state.focus = "#todoText"; render(); break;
      }
      case "toggleTodo": {
        const t = db.todos.find(x => x.id === id);
        if (t) {
          t.done = !t.done;
          t.doneAt = t.done ? Date.now() : null;   // 首頁「今日待辦」靠這個算今天完成幾件
          say(syncTodoXp(t));          // 完成／取消完成時同步技能經驗值
          save(true); render();
        }
        break;
      }
      case "delTodo": db.todos = db.todos.filter(x => x.id !== id); save(true); render(); break;
      case "todoFilter": state.todoFilter = el.dataset.k; render(); break;

      case "calPrev": state.calM--; if (state.calM < 0) { state.calM = 11; state.calY--; } render(); break;
      case "calNext": state.calM++; if (state.calM > 11) { state.calM = 0; state.calY++; } render(); break;
      case "calToday": { const d = new Date(); state.calY = d.getFullYear(); state.calM = d.getMonth(); state.daySel = TODAY(); render(); break; }
      case "selDay": state.daySel = el.dataset.d; render(); break;
      case "addEvent": {
        const t = $("#evTitle");
        if (!t.value.trim()) { t.focus(); break; }
        db.events.push({ id: uid(), date: state.daySel, time: $("#evTime").value, title: t.value.trim(), note: "" });
        save(true); state.focus = "#evTitle"; render(); break;
      }
      case "delEvent": {
        const e2 = db.events.find(x => x.id === id);
        if (e2 && e2.done && e2.xpGiven) skRemoveXp(skById(e2.skill), e2.xpGiven);  // 刪掉已完成的訓練要收回 XP
        db.events = db.events.filter(x => x.id !== id);
        save(true); render(); break;
      }
      case "trDay": {
        const d = +el.dataset.d;
        state.trainDays = state.trainDays.includes(d)
          ? state.trainDays.filter(x => x !== d) : [...state.trainDays, d].sort();
        render(); break;
      }
      case "trWeeks": state.trainWeeks = +el.dataset.w; render(); break;
      case "trXp": state.trainXp = +el.dataset.x; render(); break;
      case "schedKind": state.schedKind = el.dataset.k; render(); break;
      case "trGen": {
        state.trainTime = $("#trTime")?.value || "20:00";
        if (state.schedKind === "habit") { state.habitTitle = $("#hbTitle")?.value || ""; genHabit(); }
        else { state.trainSkill = $("#trSkill")?.value || ""; genTraining(); }
        break;
      }
      case "trToggle": {
        const e2 = db.events.find(x => x.id === id);
        if (e2) { e2.done = !e2.done; say(syncEventXp(e2)); save(true); render(); }
        break;
      }
      case "trClear": {
        const hb = state.schedKind === "habit";
        const hit = e2 => !e2.done && (hb ? e2.type === "habit" : !!e2.skill);
        const n = db.events.filter(hit).length;
        const what = hb ? "日常行動" : "訓練行程";
        if (!n) { alert(`沒有未完成的${what}。`); break; }
        if (confirm(`清除 ${n} 個未完成的${what}？已完成的會保留。`)) {
          db.events = db.events.filter(e2 => !hit(e2));
          save(true); render();
        }
        break;
      }

      case "skPick": {
        const s = skById(id);
        if (!s) break;
        state.skSel = state.skSel === id ? null : id;
        render(); break;
      }
      case "skCat": state.skCat = el.dataset.c; render(); break;
      case "skLocked": db.settings.skShowLocked = !db.settings.skShowLocked; save(true); render(); break;
      case "skEditDesc": state.skEditDesc = state.skEditDesc === id ? null : id; render(); break;
      case "skXp": {
        const s = skById(id);
        if (s && skUnlocked(s)) { skAddXp(s, +el.dataset.n); save(true); render(); }
        break;
      }
      case "skLv": {
        const s = skById(id);
        if (!s || !skUnlocked(s)) break;
        const n = +el.dataset.n;
        s.lv = Math.max(0, Math.min(s.maxLv, s.lv + n));
        s.xp = 0;
        save(true); render(); break;
      }
      case "skDel":
        if (confirm(`刪除技能「${skById(id)?.name}」？依賴它的技能會失去這個前置。`)) {
          db.skills = db.skills.filter(s => s.id !== id);
          db.skills.forEach(s => { s.req = (s.req || []).filter(r => r !== id); });
          db.todos.forEach(t => { if (t.skill === id) { t.skill = ""; t.xpGiven = 0; } });
          state.skSel = null; save(true); render();
        }
        break;
      case "skNew": {
        const name = prompt("技能名稱？");
        if (!name || !name.trim()) break;
        const cat = prompt("分類？（例如：專注力、閱讀、健康）", state.skCat === "全部" ? "專注力" : state.skCat) || "未分類";
        const tier = parseInt(prompt("階層？（0 是最底層，數字越大越後面）", "0"), 10) || 0;
        const maxLv = parseInt(prompt("最大等級？", "5"), 10) || 5;
        const desc = prompt("簡介？（這個技能是什麼、學到什麼程度算數。可留空之後再補）", "") || "";
        const s = { id: uid(), name: name.trim(), cat: cat.trim(), tier, req: [], maxLv, desc: desc.trim(), descV: 2, lv: 0, xp: 0, note: "" };
        db.skills.push(s);
        state.skSel = s.id; state.skCat = "全部";
        save(true); render(); break;
      }

      case "linkCat": state.linkCat = el.dataset.c; render(); break;
      case "addLink": {
        const t = $("#lkTitle"), u = $("#lkUrl");
        if (!u.value.trim()) { u.focus(); break; }
        let url = u.value.trim();
        if (!/^https?:\/\//i.test(url)) url = "https://" + url;
        db.links.unshift({ id: uid(), title: t.value.trim() || url, url, cat: $("#lkCat").value.trim() || "未分類", tags: [], read: false });
        save(true); state.focus = "#lkTitle"; render(); break;
      }
      case "toggleLink": { const l = db.links.find(x => x.id === id); if (l) { l.read = !l.read; save(true); render(); } break; }
      case "delLink": db.links = db.links.filter(x => x.id !== id); save(true); render(); break;
      case "pickBookmarks": $("#bmFile").click(); break;

      case "theme": db.settings.theme = el.dataset.k; save(true); render(); break;
      case "toggleChara": db.settings.chara = !db.settings.chara; save(true); render(); break;
      case "toggleBoot": db.settings.boot = !db.settings.boot; save(true); render(); break;
      case "setAvatar": db.settings.avatar = $("#avatarPath").value.trim() || DEFAULT_AVATAR; save(true); render(); break;
      case "setName": db.settings.userName = $("#userName").value.trim() || "你"; save(true); render(); break;
      case "toggleWx": db.settings.wx = !db.settings.wx; save(true); render(); break;
      case "wxRefresh2": fetchWeather(true); break;
      case "locGPS": locateGPS(); break;
      case "locIP": locateIP(); break;
      case "geoGo": {
        const q = $("#geoQ").value.trim();
        if (q) geoSearch(q);
        break;
      }
      case "geoPick": {
        const g = state.geoResults[+el.dataset.i];
        if (!g) break;
        db.settings.place = {
          name: g.name,
          addr: [g.country, g.admin1, g.admin2].filter(Boolean).join(" "),
          lat: g.latitude, lon: g.longitude
        };
        state.geoResults = []; state.geoErr = null;
        db.cache.wx = null; db.cache.at = 0;
        save(true); render(); fetchWeather(true);
        break;
      }
      case "export": {
        // 先記下匯出時間再存檔，檔名帶時分，同一天多次匯出不會變成 (1)、(2)
        const t = new Date();
        db.settings.lastExport = t.getTime();
        save(true);
        const hm = String(t.getHours()).padStart(2, "0") + String(t.getMinutes()).padStart(2, "0");
        download(`pda-backup-${TODAY()}_${hm}.json`, JSON.stringify(db, null, 2), "application/json");
        render();
        break;
      }
      case "syncOn": {
        const t = $("#syncToken").value.trim();
        if (!t) break;
        sync = { ...loadSync(), token: t, gistId: "", remoteAt: null, hash: "", err: "" };
        saveSync(); render(); syncNow(true);
        break;
      }
      case "syncNow": syncNow(true); break;
      case "syncOff":
        if (!confirm("中斷雲端同步？\n這台的資料會保留，雲端的 Gist 也不會刪除，之後貼上 Token 可以再連回來。")) break;
        sync = { ...loadSync(), token: "", gistId: "", remoteAt: null, hash: "", err: "" };
        saveSync(); showSync(); render();
        break;
      case "exportMd": download("pda-" + TODAY() + ".md", toMarkdown(), "text/markdown"); break;
      case "showDump": state.dump = { name: "pda-backup-" + TODAY() + ".json", text: JSON.stringify(db, null, 2) }; render(); break;
      case "closeDump": state.dump = null; render(); break;
      case "pickImport": $("#jsonFile").click(); break;
      case "wipe":
        if (confirm("這會清除全部資料，確定？\n（會先自動備份一份，可在「自動備份」還原）" + (sync.token ? "\n\n已開啟雲端同步：其他裝置同步後也會一起清空。" : "")) && confirm("真的確定？")) {
          if (!snapshot("清除前") && !confirm("自動備份失敗。仍要清除嗎？")) break;
          db = seed(); save(true); state.memoSel = null; render();
        }
        break;
      case "snapRestore": {
        const sn = loadSnaps()[+el.dataset.i];
        if (!sn) break;
        if (!confirm(`還原到 ${new Date(sn.at).toLocaleString("zh-TW")}（${sn.reason}）的資料？\n目前的資料也會先自動備份。`)) break;
        try {
          const d = normalize(JSON.parse(sn.data));
          snapshot("還原前");
          db = d; save(true); state.memoSel = null; render(); say("已還原備份。");
        } catch (e) { alert("還原失敗：" + e.message); }
        break;
      }
      case "snapDownload": {
        const sn = loadSnaps()[+el.dataset.i];
        if (sn) download(`pda-${sn.reason}備份-${iso(new Date(sn.at))}.json`, sn.data, "application/json");
        break;
      }
    }
    if (el.dataset.go) go(el.dataset.go);
  };

  // 備忘錄即時編輯
  const mt = $("#memoTitle"), mb = $("#memoBody");
  if (mt && mb) {
    const upd = () => {
      const m = db.memos.find(x => x.id === state.memoSel);
      if (!m) return;
      m.title = mt.value; m.body = mb.value; m.updated = Date.now();
      const sel = $(`.list .item.sel .title`);
      if (sel) sel.textContent = m.title || "（無標題）";
      const meta = $("#memoMeta");
      if (meta) meta.innerHTML = memoMetaHtml(m);
      const cnt = $("#memoCount");
      if (cnt) cnt.textContent = charCount(m.body);
      save();
    };
    mt.oninput = upd; mb.oninput = upd;
    mb.onkeydown = mdKeydown;
  }

  // 技能筆記與簡介
  const sn = $("#skNote");
  if (sn) sn.oninput = () => { const s = skById(state.skSel); if (s) { s.note = sn.value; save(); } };
  const sd = $("#skDesc");
  if (sd) sd.oninput = () => {
    const s = skById(state.skSel);
    if (!s) return;
    s.desc = sd.value; s.descV = 2;
    const box = document.querySelector(".sk-desc");
    if (box) box.textContent = s.desc;
    save();
  };

  // 搜尋框
  const mq = $("#memoQ");
  // 注音等輸入法組字中不重畫（重畫會換掉輸入框、打斷組字），選完字的 compositionend 再重畫
  const live = (n, key, sel) => {
    const apply = () => { state[key] = n.value; state.focus = sel; render(); };
    n.oninput = e => { if (!e.isComposing) apply(); };
    n.addEventListener("compositionend", apply);   // 沒有 oncompositionend 屬性，只能用 addEventListener
  };
  if (mq) live(mq, "memoQ", "#memoQ");
  const lq = $("#linkQ");
  if (lq) live(lq, "linkQ", "#linkQ");

  // Enter 送出
  const enter = (sel, act) => {
    const n = $(sel);
    if (n) n.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); v.querySelector(`[data-act="${act}"]`)?.click(); } };
  };
  enter("#quickTodo", "quickAdd");
  enter("#todoText", "addTodo");
  enter("#evTitle", "addEvent");
  enter("#lkUrl", "addLink");
  enter("#lkTitle", "addLink");
  enter("#geoQ", "geoGo");
  enter("#syncToken", "syncOn");

  // 檔案匯入
  const bm = $("#bmFile");
  if (bm) bm.onchange = () => {
    const f = bm.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const doc = new DOMParser().parseFromString(r.result, "text/html");
      const as = [...doc.querySelectorAll("a[href]")];
      let n = 0;
      as.forEach(a => {
        const url = a.getAttribute("href");
        if (!/^https?:/i.test(url)) return;
        if (db.links.some(l => l.url === url)) return;
        // 書籤所在的資料夾名稱當分類（<DT><H3>資料夾</H3><DL>…），沒有資料夾就歸到「匯入」
        const cat = a.closest("dl")?.parentElement?.querySelector(":scope > h3")?.textContent.trim() || "匯入";
        db.links.unshift({ id: uid(), title: a.textContent.trim() || url, url, cat, tags: [], read: false });
        n++;
      });
      save(true); render();
      alert(`匯入完成，新增 ${n} 筆（已跳過 ${as.length - n} 筆重複或非網址）。`);
    };
    r.readAsText(f, "utf-8");
  };

  const jf = $("#jsonFile");
  if (jf) jf.onchange = () => {
    const f = jf.files[0]; jf.value = ""; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || typeof d !== "object") throw new Error("格式不對");
        if (!confirm("匯入會覆蓋目前所有資料，確定？\n（會先自動備份目前的資料，匯錯了可以到「設定 → 資料 → 自動備份」還原）")) return;
        if (!snapshot("匯入前") && !confirm("自動備份失敗。仍要繼續匯入嗎？建議先按「匯出 JSON」手動備份。")) return;
        db = normalize(d);
        save(true); state.memoSel = null; render();
        alert("匯入完成。原本的資料已自動備份，可在「設定 → 資料 → 自動備份」還原。");
      } catch (e) { alert("匯入失敗：" + e.message); }
    };
    r.readAsText(f, "utf-8");
  };
}

/* ================= 匯出 ================= */
function download(name, text, mime) {
  try {
    const url = URL.createObjectURL(new Blob([text], { type: mime + ";charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.style.display = "none";
    document.body.appendChild(a);   // 必須掛進 DOM，否則部分瀏覽器會忽略這次 click
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 2000);
    say(`已匯出 ${name}，請看瀏覽器的下載項目。`);
  } catch (e) {
    // 下載被擋掉時的退路：把內容顯示出來讓使用者自己複製
    state.dump = { name, text };
    render();
  }
}

function toMarkdown() {
  const L = [`# PDA 匯出 · ${TODAY()}`, ""];
  L.push("## 待辦", "");
  db.todos.forEach(t => L.push(`- [${t.done ? "x" : " "}] ${t.text}${t.due ? ` （${t.due}）` : ""}`));
  L.push("", "## 行事曆", "");
  [...db.events].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
    .forEach(e => L.push(`- ${e.skill ? `[${e.done ? "x" : " "}] ` : ""}${e.date} ${e.time || ""} ${e.title}${e.skill ? `（⚔ +${e.xp || 25}XP）` : ""}`));
  L.push("", "## 分頁收藏", "");
  db.links.forEach(l => L.push(`- [${l.title}](${l.url})${l.cat ? ` \`${l.cat}\`` : ""}`));
  L.push("", "## 技能樹", "");
  [...db.skills].sort((a, b) => a.cat.localeCompare(b.cat) || a.tier - b.tier).forEach(s =>
    L.push(`- [${s.lv >= s.maxLv ? "x" : " "}] ${s.cat}／${s.name} — Lv.${s.lv}/${s.maxLv}${s.note ? `（${s.note.replace(/\n/g, " ")}）` : ""}`));
  L.push("", "## 知識庫", "");
  db.memos.filter(m => m.kb).forEach(m => L.push(`### ${m.title || "（無標題）"}`, "", m.body, ""));
  L.push("", "## 備忘錄", "");
  db.memos.filter(m => !m.kb).forEach(m => L.push(`### ${m.title || "（無標題）"}`, "", m.body, ""));
  return L.join("\n");
}

/* ================= 啟動 ================= */
document.addEventListener("keydown", e => {
  if (e.altKey && e.key >= "1" && e.key <= String(MODULES.length)) {
    e.preventDefault();
    go(MODULES[+e.key - 1].id);
  }
});

setInterval(() => {
  const d = new Date();
  $("#clock").textContent = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}, 1000);

/* 開機序列：逐行打字，點一下或按任意鍵可略過 */
function boot() {
  const box = document.getElementById("boot");
  if (!box || !db.settings.boot) return;
  const kb = (new Blob([JSON.stringify(db)]).size / 1024).toFixed(1);
  const lines = [
    "PERSONAL DIGITAL ASSISTANT",
    "パーソナル・デジタル・アシスタント",
    "",
    "BOOT SEQUENCE ............ START",
    "MEMORY CHECK ............. OK",
    `LOCAL STORAGE ............ OK  (${kb} KB)`,
    `MODULES LOADED ........... ${MODULES.length}`,
    `RECORDS .................. ${db.memos.length + db.todos.length + db.events.length + db.links.length}`,
    "NAVI ..................... ONLINE",
    "",
    "SYSTEM READY."
  ];
  box.classList.remove("off");
  box.textContent = "";
  let i = 0;
  const t = setInterval(() => {
    box.textContent += lines[i++] + "\n";
    if (i >= lines.length) { clearInterval(t); setTimeout(done, 420); }
  }, 95);
  function done() { clearInterval(t); box.classList.add("off"); }
  box.onclick = done;
  document.addEventListener("keydown", done, { once: true });
}

render();
boot();
showSync();
syncNow();
fetchWeather();
setInterval(() => fetchWeather(), 30 * 60 * 1000);
// 放在 https 網址（GitHub Pages）時註冊離線快取；本機 file:// 不需要
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
